<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Amazon Deal Check</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
</head>
<body>
<style>
  :root {
    /* palette matches sgtfba.github.io/fba-profit-calculator: ink navy / paper / brass orange */
    --bg: #f7f8fa;
    --surface: #ffffff;
    --surface-2: #edeff3;
    --ink: #131921;
    --ink-soft: rgba(19,25,33,0.62);
    --line: rgba(19,25,33,0.14);
    --accent: #ff9900;
    --accent-ink: #131921;
    --go: #2f9e5c;
    --go-ink: #ffffff;
    --stop: #d6473a;
    --stop-ink: #ffffff;
    --caution: #b36a00;
    --shadow: 0 20px 44px -28px rgba(19,25,33,0.3), 0 0 0 1px rgba(19,25,33,0.04);

    --fs-2xs: 0.6875rem;
    --fs-sm: 0.8125rem;
    --fs-base: 0.875rem;
    --fs-md: 0.9375rem;
    --fs-xl: 1.125rem;
    --fs-2xl: 1.375rem;
    --fs-3xl: clamp(1.5rem, 1.1rem + 1.4vw, 2rem);
    --fs-4xl: 2.25rem;
    --font-body: "IBM Plex Sans", ui-sans-serif, system-ui, sans-serif;
    --font-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #131921;
      --surface: #1b232e;
      --surface-2: #232c38;
      --ink: #f7f8fa;
      --ink-soft: rgba(247,248,250,0.62);
      --line: rgba(247,248,250,0.14);
      --accent: #ffac31;
      --accent-ink: #131921;
      --go: #3fc57d;
      --go-ink: #0d1a10;
      --stop: #ff6f5f;
      --stop-ink: #290604;
      --caution: #d99a2b;
      --shadow: 0 24px 50px -20px rgba(0,0,0,0.55), 0 0 0 1px rgba(0,0,0,0.3);
    }
  }
  :root[data-theme="dark"] {
    --bg: #131921;
    --surface: #1b232e;
    --surface-2: #232c38;
    --ink: #f7f8fa;
    --ink-soft: rgba(247,248,250,0.62);
    --line: rgba(247,248,250,0.14);
    --accent: #ffac31;
    --accent-ink: #131921;
    --go: #3fc57d;
    --go-ink: #0d1a10;
    --stop: #ff6f5f;
    --stop-ink: #290604;
    --caution: #d99a2b;
    --shadow: 0 24px 50px -20px rgba(0,0,0,0.55), 0 0 0 1px rgba(0,0,0,0.3);
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--font-body);
    padding-inline: 20px;
    padding-block: 32px 56px;
  }
  .wrap { max-width: 640px; margin-inline: auto; display: flex; flex-direction: column; gap: 22px; }
  .wrap[hidden] { display: none; }

  header {
    display: flex; align-items: center; gap: 12px; position: relative;
    padding: 4px 6px; overflow: hidden; border-radius: 10px;
  }
  .hero-icon {
    position: absolute; top: -14px; right: -10px; width: 74px; height: 89px;
    transform: rotate(18deg); opacity: 0.14; stroke: var(--accent); pointer-events: none;
  }
  .eyebrow {
    font-family: var(--font-mono); font-weight: 500; font-size: var(--fs-2xs);
    letter-spacing: 0.18em; text-transform: uppercase; color: var(--accent);
    margin: 0 0 2px;
  }
  .mark {
    width: 42px; height: 42px; border-radius: 50%; flex: none;
    background: radial-gradient(circle at 32% 28%, #ffc270, var(--accent) 70%);
    display: flex; align-items: center; justify-content: center;
    font-family: var(--font-body);
    font-weight: 700; color: var(--accent-ink); font-size: var(--fs-xl);
  }
  .brand-text { display: flex; flex-direction: column; gap: 1px; }
  .brand-text b {
    font-family: var(--font-body);
    font-weight: 700; font-size: var(--fs-2xl); letter-spacing: 0.01em; line-height: 1;
  }
  .brand-text span { font-size: var(--fs-sm); color: var(--ink-soft); }

  .tabs {
    display: flex; gap: 6px; background: var(--surface-2); border-radius: 999px; padding: 4px;
    border: 1px solid var(--line);
  }
  .tab {
    flex: 1; text-align: center; padding: 9px 14px; border-radius: 999px; cursor: pointer;
    font-weight: 600; font-size: var(--fs-base); color: var(--ink-soft); user-select: none;
    transition: background .15s, color .15s;
  }
  .tab[aria-selected="true"] { background: var(--surface); color: var(--ink); box-shadow: var(--shadow); }
  .tab:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .panel { display: flex; flex-direction: column; gap: 18px; }
  .panel[hidden] { display: none; }

  .log-card {
    background: var(--surface); border: 1px solid var(--line); border-radius: 10px;
    padding: 4px 18px;
  }
  .qa-row {
    display: flex; justify-content: space-between; align-items: center; gap: 14px;
    padding: 12px 0; border-top: 1px solid var(--line);
  }
  .qa-row:first-child { border-top: none; }
  .qa-row-wrap { border-top: 1px solid var(--line); }
  .qa-row-wrap:first-child { border-top: none; }
  .qa-row-wrap .qa-row { border-top: none; padding-bottom: 4px; }
  .qa-note {
    font-size: var(--fs-sm); color: var(--caution); padding: 0 0 12px; margin: -4px 0 0;
    display: flex; align-items: center; gap: 5px;
  }
  .qa-row .q { font-size: var(--fs-base); color: var(--ink-soft); line-height: 1.35; }
  .qa-pill {
    font-family: var(--font-body); font-weight: 700; font-size: var(--fs-sm);
    letter-spacing: 0.04em; text-transform: uppercase; padding: 4px 11px; border-radius: 999px;
    flex: none;
  }
  .qa-pill.yes { background: var(--go); color: var(--go-ink); }
  .qa-pill.no { background: var(--stop); color: var(--stop-ink); }

  .card {
    background: var(--surface); border: 1px solid var(--line); border-radius: 10px;
    padding: 28px 26px; box-shadow: var(--shadow);
    display: flex; flex-direction: column; gap: 16px;
  }
  .card h2 {
    font-family: var(--font-body);
    font-weight: 700; font-size: var(--fs-3xl);
    margin: 0; line-height: 1.08; text-wrap: balance;
  }
  .card .sub { margin: 0; color: var(--ink-soft); font-size: var(--fs-md); line-height: 1.5; }
  .checklist { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 6px; }
  .checklist li {
    font-size: var(--fs-base); color: var(--ink-soft); padding-left: 18px; position: relative;
  }
  .checklist li::before {
    content: ""; position: absolute; left: 0; top: 0.55em; width: 6px; height: 6px;
    border-radius: 50%; background: var(--accent);
  }

  .choice-row { display: flex; gap: 10px; margin-top: 4px; }
  .choice {
    flex: 1; padding: 14px 16px; border-radius: 8px; border: none; cursor: pointer;
    font-family: var(--font-body); font-weight: 700; font-size: var(--fs-xl);
    letter-spacing: 0.02em;
  }
  .choice:focus-visible { outline: 3px solid var(--ink); outline-offset: 2px; }
  .choice.yes { background: var(--go); color: var(--go-ink); }
  .choice.no { background: var(--stop); color: var(--stop-ink); }
  .choice:active { transform: translateY(1px); }

  .back-link {
    align-self: flex-start; background: none; border: none; cursor: pointer;
    color: var(--ink-soft); font-size: var(--fs-sm); font-weight: 500; padding: 2px 0;
    display: flex; align-items: center; gap: 4px;
  }
  .back-link:hover { color: var(--ink); }

  .result {
    border-radius: 10px; padding: 32px 26px; display: flex; flex-direction: column; gap: 14px;
    box-shadow: var(--shadow);
  }
  .result.go { background: var(--go); color: var(--go-ink); }
  .result.stop { background: var(--stop); color: var(--stop-ink); }
  .result .tag {
    font-family: var(--font-body); font-weight: 700; font-size: var(--fs-4xl);
    letter-spacing: 0.01em; line-height: 1;
  }
  .result p { margin: 0; font-size: var(--fs-md); line-height: 1.5; opacity: 0.96; }
  .result-btn {
    align-self: flex-start; margin-top: 6px; background: rgba(255,255,255,0.22);
    border: 1px solid rgba(255,255,255,0.5); color: inherit; font-weight: 600;
    padding: 10px 18px; border-radius: 999px; cursor: pointer; font-size: var(--fs-sm);
  }
  .result-btn:hover { background: rgba(255,255,255,0.32); }

  .checklist-card { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 22px; box-shadow: var(--shadow); display: flex; flex-direction: column; gap: 4px; }
  .checklist-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
  .checklist-head h2 { font-family: var(--font-body); font-weight: 700; font-size: var(--fs-2xl); margin: 0; }
  .progress-pill { font-size: var(--fs-sm); font-weight: 600; color: var(--ink-soft); background: var(--surface-2); padding: 5px 11px; border-radius: 999px; }
  .item {
    display: flex; gap: 12px; align-items: flex-start; padding: 13px 4px; border-top: 1px solid var(--line);
    cursor: pointer;
  }
  .item:first-of-type { border-top: none; }
  .item input { margin-top: 3px; width: 18px; height: 18px; accent-color: var(--go); flex: none; cursor: pointer; }
  .item .label { display: flex; flex-direction: column; gap: 2px; }
  .item .label b { font-size: var(--fs-md); font-weight: 600; }
  .item .label span { font-size: var(--fs-sm); color: var(--ink-soft); }
  .item.checked .label b { text-decoration: line-through; color: var(--ink-soft); }

  .reset-row { display: flex; justify-content: flex-end; }
  .reset-link { background: none; border: none; color: var(--ink-soft); font-size: var(--fs-sm); cursor: pointer; padding: 4px 0; }
  .reset-link:hover { color: var(--stop); }

  @media (max-width: 480px) {
    .choice-row { flex-direction: column; }
  }

  /* --- email gate --- */
  .gate { max-width: 560px; margin: 0 auto; }
  .gate-hero {
    background: #131921; color: #f7f8fa; border-radius: 14px;
    padding: 34px 26px 46px; text-align: center; position: relative; overflow: hidden;
  }
  .gate-hero .hero-icon {
    position: absolute; top: 14px; right: 6px; width: 84px; height: 101px;
    opacity: 0.13; stroke: #ff9900; transform: rotate(18deg); pointer-events: none;
  }
  .gate-hero .eyebrow { display: block; text-align: center; color: #ffac31; }
  .gate-hero h1 {
    font-family: var(--font-body); font-weight: 800; margin: 4px 0 10px; line-height: 1.08;
    font-size: clamp(1.6rem, 1.2rem + 2vw, 2.2rem);
  }
  .gate-hero h1 em { font-style: normal; color: #ffac31; }
  .gate-hero p { margin: 0; color: rgba(247,248,250,0.72); font-size: var(--fs-md); line-height: 1.5; }

  .gate-panel {
    margin: -26px 14px 0; background: var(--surface); color: var(--ink);
    border-radius: 12px; padding: 22px 20px 18px; position: relative; z-index: 1;
    box-shadow: var(--shadow); border: 1px solid var(--line);
  }
  .gate-label {
    font-family: var(--font-mono); font-size: var(--fs-2xs); letter-spacing: 0.18em;
    text-transform: uppercase; color: var(--ink-soft); text-align: center; margin: 0 0 16px;
  }
  .gate-preview {
    position: relative; border-radius: 10px; overflow: hidden; margin: 0 0 18px;
    border: 1px solid var(--line); box-shadow: var(--shadow);
  }
  .gate-preview img { display: block; width: 100%; height: auto; }
  .gate-preview .gate-preview-dark { display: none; }
  .gate-preview::after {
    content: ""; position: absolute; inset: auto 0 0 0; height: 46%;
    background: linear-gradient(to bottom, transparent, var(--surface));
    pointer-events: none;
  }
  .gate-preview-tag {
    font-family: var(--font-mono); font-size: var(--fs-2xs); letter-spacing: 0.14em;
    text-transform: uppercase; color: var(--ink-soft); text-align: center; margin: 0 0 8px;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) .gate-preview .gate-preview-light { display: none; }
    :root:not([data-theme="light"]) .gate-preview .gate-preview-dark { display: block; }
  }
  :root[data-theme="dark"] .gate-preview .gate-preview-light { display: none; }
  :root[data-theme="dark"] .gate-preview .gate-preview-dark { display: block; }

  .gate-frame-wrap { display: flex; justify-content: center; }
  .gate-frame { width: 100%; max-width: 400px; height: 420px; border: none; display: block; border-radius: 8px; }

  .gate-cta {
    display: flex; align-items: center; justify-content: center; gap: 8px;
    width: 100%; max-width: 400px; margin: 0 auto; padding: 14px 20px;
    background: var(--accent); color: var(--accent-ink); font-family: var(--font-body);
    font-weight: 700; font-size: var(--fs-md); text-decoration: none;
    border-radius: 10px; box-sizing: border-box; transition: filter 0.15s ease;
  }
  .gate-cta:hover { filter: brightness(1.05); }
  .gate-cta svg { width: 18px; height: 18px; flex: none; }
  .gate-manual {
    text-align: center; margin-top: 14px;
  }
  .gate-manual button {
    background: none; border: none; color: var(--ink-soft); font-size: var(--fs-sm);
    cursor: pointer; text-decoration: underline; padding: 4px;
  }
  .gate-manual button:hover { color: var(--ink); }
</style>


<div class="wrap" id="tool-wrap">
  <header>
    <svg class="hero-icon" viewBox="0 0 100 120" fill="none" xmlns="http://www.w3.org/2000/svg">
      <rect x="5" y="5" width="90" height="110" rx="8" stroke-width="3"></rect>
      <rect x="16" y="16" width="68" height="24" rx="3" stroke-width="3"></rect>
      <circle cx="24" cy="56" r="6" stroke-width="3"></circle>
      <circle cx="50" cy="56" r="6" stroke-width="3"></circle>
      <circle cx="76" cy="56" r="6" stroke-width="3"></circle>
      <circle cx="24" cy="78" r="6" stroke-width="3"></circle>
      <circle cx="50" cy="78" r="6" stroke-width="3"></circle>
      <circle cx="76" cy="78" r="6" stroke-width="3"></circle>
      <circle cx="24" cy="100" r="6" stroke-width="3"></circle>
      <circle cx="50" cy="100" r="6" stroke-width="3"></circle>
      <circle cx="76" cy="100" r="6" stroke-width="3"></circle>
    </svg>
    <div class="mark">&#10003;</div>
    <div class="brand-text">
      <span class="eyebrow">SGTFBA</span>
      <b>Amazon Deal Check</b>
      <span>Work through the key checks before you commit to a deal — restrictions, gating, profit and risk.</span>
    </div>
  </header>

  <div class="tabs" role="tablist">
    <div class="tab" id="tab-flow" role="tab" aria-selected="true" tabindex="0">Amazon Deal Check</div>
    <div class="tab" id="tab-list" role="tab" aria-selected="false" tabindex="0">Store Checklist</div>
  </div>

  <section class="panel" id="panel-flow">
    <div class="log-card" id="log-card" hidden></div>
    <div id="flow-stage"></div>
  </section>

  <section class="panel" id="panel-list" hidden>
    <div class="checklist-card">
      <div class="checklist-head">
        <h2>Store legitimacy</h2>
        <span class="progress-pill" id="list-progress">0 / 6</span>
      </div>
      <div id="list-items"></div>
    </div>
    <div class="reset-row"><button class="reset-link" id="reset-list">Reset checklist</button></div>
  </section>
</div>


<script>
(function () {
  var STEPS = {
    restricted: {
      cat: 'Restricted',
      q: 'Is the product restricted?',
      yes: { stop: 'This one’s restricted on Amazon — don’t proceed.' },
      no: 'eligible'
    },
    eligible: {
      cat: 'Eligible',
      q: 'Are you eligible to list it?',
      yes: 'transparency',
      no: { stop: 'You’re not eligible to list this — work out why before you buy it.' }
    },
    transparency: {
      cat: 'Transparency',
      q: 'Is it enrolled in the Transparency programme and does it need T-codes?',
      sub: ['If yes: make sure you can secure enough units to cover the T-codes before buying.'],
      yes: 'brand',
      no: 'brand'
    },
    brand: {
      cat: 'Brand',
      q: 'Is it listed under the correct brand?',
      yes: 'gated',
      no: { stop: 'It’s not listed under the correct brand — don’t proceed.' }
    },
    gated: {
      cat: 'Gated',
      q: 'Are you gated on this?',
      yes: 'ungate',
      no: 'profitable'
    },
    ungate: {
      cat: 'Gated',
      q: 'Can you get ungated?',
      yes: 'profitable',
      no: { stop: 'You’re gated and can’t get ungated — don’t proceed.' }
    },
    profitable: {
      cat: 'Profit',
      q: 'Is it profitable?',
      yes: 'ipsigns',
      no: { stop: 'The numbers don’t work — not profitable enough to buy.' }
    },
    ipsigns: {
      cat: 'IP signs',
      q: 'Any IP signs?',
      sub: ['Sudden seller drop', 'Is it on the IP list', 'No other sellers', 'Any sellers on any other of the brand’s listings?'],
      yes: 'ipcheck',
      no: 'price'
    },
    ipcheck: {
      cat: 'IP signs',
      q: 'You checked it — is it OK?',
      yes: 'price',
      no: { stop: 'IP signs checked out badly — too risky, don’t proceed.' }
    },
    price: {
      cat: 'Price',
      q: 'Is the price stable?',
      yes: 'bsr',
      no: { stop: 'Price isn’t stable — hold off.' }
    },
    bsr: {
      cat: 'Sales rank',
      q: 'Are there BSR drops over 30/90/180 days?',
      yes: 'banner',
      no: 'banner',
      noNote: 'Proceed with caution — this may indicate the product doesn’t sell.'
    },
    banner: {
      cat: 'Sales rank',
      q: 'Is there a sales banner on the listing?',
      sub: ['e.g. “This product has sold 50+ times in the past month”'],
      yes: 'competition',
      no: {
        stop: 'No BSR-drop check and no sales banner — that could mean this product doesn’t sell very well.',
        overrideNext: 'competition',
        overrideLabel: 'Product sells slowly but I still want to purchase'
      }
    },
    competition: {
      cat: 'Competition',
      q: 'Is competition okay?',
      yes: { go: 'Buy it — this deal has cleared every check.' },
      no: { stop: 'Competition isn’t in a good spot right now — hold off.' }
    }
  };
  var answered = []; // [{ id, question, answer }]
  var current = 'restricted';
  var outcome = null;

  var stage = document.getElementById('flow-stage');
  var logCard = document.getElementById('log-card');

  function renderLog() {
    if (!answered.length) { logCard.hidden = true; logCard.innerHTML = ''; return; }
    logCard.hidden = false;
    logCard.innerHTML = '';
    answered.forEach(function (entry) {
      var wrap = document.createElement('div');
      wrap.className = 'qa-row-wrap';
      var row = document.createElement('div');
      row.className = 'qa-row';
      var q = document.createElement('span');
      q.className = 'q';
      q.textContent = entry.question;
      var pill = document.createElement('span');
      pill.className = 'qa-pill ' + (entry.answer ? 'yes' : 'no');
      pill.textContent = entry.answer ? 'Yes' : 'No';
      row.appendChild(q);
      row.appendChild(pill);
      wrap.appendChild(row);
      if (entry.note) {
        var note = document.createElement('div');
        note.className = 'qa-note';
        note.textContent = '⚠ ' + entry.note;
        wrap.appendChild(note);
      }
      logCard.appendChild(wrap);
    });
  }

  function choose(answer) {
    var step = STEPS[current];
    var note = answer ? step.yesNote : step.noNote;
    answered.push({ id: current, question: step.q, answer: answer, note: note });
    var next = answer ? step.yes : step.no;
    if (typeof next === 'string') {
      current = next;
      render();
    } else {
      outcome = next;
      render();
    }
  }

  function goBack() {
    if (answered.length) {
      var last = answered.pop();
      current = last.id;
      outcome = null;
      render();
    }
  }

  function restart() {
    answered = [];
    current = 'restricted';
    outcome = null;
    render();
  }

  function continueAnyway(nextId) {
    current = nextId;
    outcome = null;
    render();
  }

  function render() {
    renderLog();
    stage.innerHTML = '';
    if (outcome) {
      var isGo = !!outcome.go;
      var card = document.createElement('div');
      card.className = 'result ' + (isGo ? 'go' : 'stop');
      var tag = document.createElement('div');
      tag.className = 'tag';
      tag.textContent = isGo ? 'BUY' : 'STOP';
      var msg = document.createElement('p');
      msg.textContent = outcome.go || outcome.stop;
      card.appendChild(tag);
      card.appendChild(msg);

      if (outcome.overrideNext) {
        var overrideBtn = document.createElement('button');
        overrideBtn.className = 'result-btn';
        overrideBtn.textContent = outcome.overrideLabel;
        overrideBtn.addEventListener('click', function () { continueAnyway(outcome.overrideNext); });
        card.appendChild(overrideBtn);
      }

      var btn = document.createElement('button');
      btn.className = 'result-btn';
      btn.textContent = 'Check another deal';
      btn.addEventListener('click', restart);
      card.appendChild(btn);
      stage.appendChild(card);
      return;
    }

    var step = STEPS[current];
    var card = document.createElement('div');
    card.className = 'card';

    if (answered.length) {
      var back = document.createElement('button');
      back.className = 'back-link';
      back.textContent = '← Back';
      back.addEventListener('click', goBack);
      card.appendChild(back);
    }

    var h2 = document.createElement('h2');
    h2.textContent = step.q;
    card.appendChild(h2);

    if (step.sub) {
      var ul = document.createElement('ul');
      ul.className = 'checklist';
      step.sub.forEach(function (s) {
        var li = document.createElement('li');
        li.textContent = s;
        ul.appendChild(li);
      });
      card.appendChild(ul);
    }

    var row = document.createElement('div');
    row.className = 'choice-row';
    var yesBtn = document.createElement('button');
    yesBtn.className = 'choice yes';
    yesBtn.textContent = 'Yes';
    yesBtn.addEventListener('click', function () { choose(true); });
    var noBtn = document.createElement('button');
    noBtn.className = 'choice no';
    noBtn.textContent = 'No';
    noBtn.addEventListener('click', function () { choose(false); });
    row.appendChild(yesBtn);
    row.appendChild(noBtn);
    card.appendChild(row);

    stage.appendChild(card);
  }

  render();

  // --- tabs ---
  var tabFlow = document.getElementById('tab-flow');
  var tabList = document.getElementById('tab-list');
  var panelFlow = document.getElementById('panel-flow');
  var panelList = document.getElementById('panel-list');

  function showTab(which) {
    var flowActive = which === 'flow';
    tabFlow.setAttribute('aria-selected', flowActive ? 'true' : 'false');
    tabList.setAttribute('aria-selected', flowActive ? 'false' : 'true');
    panelFlow.hidden = !flowActive;
    panelList.hidden = flowActive;
  }
  tabFlow.addEventListener('click', function () { showTab('flow'); });
  tabList.addEventListener('click', function () { showTab('list'); });
  [tabFlow, tabList].forEach(function (t) {
    t.addEventListener('keydown', function (e) {
      if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); t.click(); }
    });
  });

  // --- store checklist ---
  var LIST_ITEMS = [
    { id: 'contact', label: 'Proper contact info', sub: 'Business address, etc.' },
    { id: 'companies-house', label: 'Companies House check', sub: 'How many years running?' },
    { id: 'vat', label: 'VAT number', sub: 'Check it’s valid' },
    { id: 'trustpilot', label: 'Trustpilot reviews', sub: 'Look at the most recent ones' },
    { id: 'contact-2', label: 'Contact info double-check', sub: 'Confirm it’s genuine, not just listed' },
    { id: 'credit-card', label: 'Use a credit card', sub: 'For payment security, if possible' }
  ];
  var STORAGE_KEY = 'deal-check-store-checklist-v1';
  var listRoot = document.getElementById('list-items');
  var progressPill = document.getElementById('list-progress');

  function loadChecked() {
    try {
      var raw = localStorage.getItem(STORAGE_KEY);
      return raw ? JSON.parse(raw) : {};
    } catch (e) { return {}; }
  }
  function saveChecked(state) {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch (e) {}
  }

  var checkedState = loadChecked();

  function renderList() {
    listRoot.innerHTML = '';
    var doneCount = 0;
    LIST_ITEMS.forEach(function (item) {
      var isChecked = !!checkedState[item.id];
      if (isChecked) doneCount++;
      var row = document.createElement('label');
      row.className = 'item' + (isChecked ? ' checked' : '');
      var cb = document.createElement('input');
      cb.type = 'checkbox';
      cb.checked = isChecked;
      cb.id = 'chk-' + item.id;
      cb.addEventListener('change', function () {
        checkedState[item.id] = cb.checked;
        saveChecked(checkedState);
        renderList();
      });
      var labelWrap = document.createElement('span');
      labelWrap.className = 'label';
      var b = document.createElement('b');
      b.textContent = item.label;
      var span = document.createElement('span');
      span.textContent = item.sub;
      labelWrap.appendChild(b);
      labelWrap.appendChild(span);
      row.appendChild(cb);
      row.appendChild(labelWrap);
      listRoot.appendChild(row);
    });
    progressPill.textContent = doneCount + ' / ' + LIST_ITEMS.length;
  }
  renderList();

  document.getElementById('reset-list').addEventListener('click', function () {
    checkedState = {};
    saveChecked(checkedState);
    renderList();
  });
})();
</script>
</body>
</html>
